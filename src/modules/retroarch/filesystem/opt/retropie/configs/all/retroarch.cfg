# RetroArch config — SmartPi One (AllWinner H3 / Mali-400)
# Optimized for OpenGL ES 2.0 + armhf performance

# Video — Mali-400 OpenGL ES 2.0
video_driver = "gl"
video_context_driver = "egl_plain"
video_threaded = "true"
video_smooth = "false"
video_vsync = "true"
video_fullscreen = "true"
video_aspect_ratio_auto = "true"
video_scale_integer = "false"

# Performance — H3 Cortex-A7 (no rewind, no runahead)
rewind_enable = "false"
run_ahead_enabled = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"

# Audio — ALSA
audio_driver = "alsa"
audio_latency = "64"

# Input
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_player1_joypad_index = "0"

# Player 1 — USB Gamepad (Twin PS2 / Generic 0810:0001)
input_player1_a_btn = "2"
input_player1_b_btn = "1"
input_player1_x_btn = "3"
input_player1_y_btn = "0"
input_player1_select_btn = "8"
input_player1_start_btn = "9"
input_player1_up_axis = "-1"
input_player1_down_axis = "+1"
input_player1_left_axis = "-0"
input_player1_right_axis = "+0"
input_player1_l_btn = "6"
input_player1_r_btn = "7"
input_player1_l2_btn = "4"
input_player1_r2_btn = "5"
input_player1_l3_btn = "10"
input_player1_r3_btn = "11"
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_r_x_plus_axis = "+3"
input_player1_r_x_minus_axis = "-3"
input_player1_r_y_plus_axis = "+2"
input_player1_r_y_minus_axis = "-2"

# Hotkeys (hold SELECT + button)
input_enable_hotkey_btn = "8"
input_menu_toggle_btn = nul
input_menu_toggle_gamepad_combo = "2"
input_exit_emulator_btn = "9"
input_save_state_btn = "5"
input_load_state_btn = "4"

# Shaders
video_shader_enable = "true"

# UI
menu_driver = "xmb"
menu_unified_controls = "true"
pause_nonactive = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"

# Paths
savefile_directory = "/home/pi/RetroPie/saves"
savestate_directory = "/home/pi/RetroPie/savestates"
screenshot_directory = "/home/pi/RetroPie/screenshots"
