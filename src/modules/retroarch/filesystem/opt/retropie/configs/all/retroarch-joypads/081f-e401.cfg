# RetroMi controller profile — Mega Drive 6-button USB (081F:E401)
# Physical layout: A B C  (face row 1)
#                  X Y Z  (face row 2)
#                  L R    (shoulders)
#                  Start  (no Select/Mode)
#
# RetroArch convention: b=confirm a=right x=top y=left
# MD→RA:  B→b  C→a  A→y  Y→x  X→l  Z→r  L→l2  R→r2
#
# Hotkey: X (btn8) — X+Start = quit game
analog_dpad_mode=1
b_btn=2
a_btn=1
y_btn=4
x_btn=3
l_btn=8
r_btn=0
l2_btn=6
r2_btn=7
start_btn=9
select_btn=8
hotkey_btn=8
up_axis=-1
down_axis=+1
left_axis=-0
right_axis=+0
