# RetroMi — Prefer hid-playstation over hid-sony for DS4 v2 (054C:09CC)
# hid-playstation handles DS4 v2 BT correctly (sends feature report 0x02 + output report 0x11)
# hid-sony lacks the 09CC BT alias in Armbian kernel 6.18
# Once hid-playstation is installed via DKMS, it takes priority for DS4 v2
softdep hid-generic pre: hid-playstation
