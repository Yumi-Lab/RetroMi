PACKAGE_NAME="hid-playstation"
PACKAGE_VERSION="1.0"

# Module 1: led-class-multicolor (dependency for hid-playstation)
BUILT_MODULE_NAME[0]="led-class-multicolor"
BUILT_MODULE_LOCATION[0]=""
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Module 2: hid-playstation (DS4 v2 BT/USB + DualSense)
BUILT_MODULE_NAME[1]="hid-playstation"
BUILT_MODULE_LOCATION[1]=""
DEST_MODULE_LOCATION[1]="/updates/dkms"

AUTOINSTALL="yes"
MAKE="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
